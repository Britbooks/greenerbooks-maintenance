<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance | Greener Books</title>
    <style>
        :root {
            --gb-green: #1A5C38;
            --gb-green-mid: #2E8B57;
            --gb-green-light: #4CAF50;
            --gb-green-tint: #EBF5EE;
            --gb-white: #FFFFFF;
            --gb-text: #1A2E22;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: var(--gb-white);
            color: var(--gb-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Subtle leaf-pattern background accent */
        body::before {
            content: "";
            position: fixed;
            top: -120px;
            right: -120px;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(46,139,87,0.08) 0%, transparent 70%);
            pointer-events: none;
        }

        body::after {
            content: "";
            position: fixed;
            bottom: -100px;
            left: -100px;
            width: 360px;
            height: 360px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(26,92,56,0.06) 0%, transparent 70%);
            pointer-events: none;
        }

        .wrapper {
            opacity: 0;
            animation: fadeIn 1.4s cubic-bezier(0.19, 1, 0.22, 1) forwards;
            text-align: center;
            padding: 40px 20px;
            width: 100%;
            max-width: 760px;
            position: relative;
            z-index: 1;
        }

        .logo-wrap {
            margin-bottom: 52px;
        }

        .logo {
            width: 200px;
            height: auto;
        }

        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 36px;
        }

        .divider-line {
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gb-green-mid));
        }

        .divider-line:last-child {
            background: linear-gradient(90deg, var(--gb-green-mid), transparent);
        }

        .divider-leaf {
            color: var(--gb-green-light);
            font-size: 14px;
        }

        h1 {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 6px;
            font-weight: 600;
            margin-bottom: 28px;
            color: var(--gb-green);
        }

        .tagline {
            font-size: 1.55rem;
            font-family: Georgia, "Times New Roman", serif;
            line-height: 1.6;
            max-width: 580px;
            margin: 0 auto 44px;
            color: #2a3d2f;
            font-style: italic;
        }

        .badge {
            display: inline-block;
            background-color: var(--gb-green-tint);
            color: var(--gb-green);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 8px 20px;
            border-radius: 30px;
            border: 1px solid rgba(46,139,87,0.25);
            margin-bottom: 44px;
        }

        .contact-section {
            margin-top: 8px;
        }

        .contact-label {
            font-size: 0.875rem;
            color: #7a9a82;
            margin-bottom: 14px;
            font-style: normal;
            letter-spacing: 0.5px;
        }

        .contact-link {
            font-size: 0.95rem;
            color: var(--gb-green);
            text-decoration: none;
            border-bottom: 1.5px solid rgba(26,92,56,0.25);
            padding-bottom: 4px;
            font-weight: 500;
            transition: all 0.35s ease;
        }

        .contact-link:hover {
            color: var(--gb-green-light);
            border-bottom-color: var(--gb-green-light);
        }

        footer {
            position: fixed;
            bottom: 36px;
            font-size: 10.5px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #9dbb9d;
            z-index: 1;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            .tagline { font-size: 1.25rem; }
            .logo { width: 170px; }
            h1 { font-size: 9px; letter-spacing: 4px; }
            .divider-line { width: 40px; }
        }
    </style>
</head>
<body>

    <div class="wrapper">

        <div class="logo-wrap">
            <img src="https://greenerbooks-production.up.railway.app/" alt="Greener Books Logo" class="logo">
        </div>

        <div class="divider">
            <span class="divider-line"></span>
            <span class="divider-leaf">&#9679;</span>
            <span class="divider-line"></span>
        </div>
                                                                                           
               
        <h1>Maintenance in Progress</h1>

        <p class="tagline">Our online store is taking a brief pause while we tend to things behind the scenes. We'll be back shortly, greener than ever.</p>

        <div class="badge">Back Soon</div>

        <div class="contact-section">
            <p class="contact-label">For enquiries, please reach us at</p>
            <a href="mailto:hello@greenerbooks.co.uk" class="contact-link">customer@greenerbooks.co.uk</a>
        </div>

    </div>

    <footer>
        &copy; 2026 Greener Books
    </footer>

</body>
</html>
